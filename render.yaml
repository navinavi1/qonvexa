services:
  - type: web
    name: qonvexa
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run verify && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    domains:
      - qonvexa.co
    disk:
      name: qonvexa-data
      mountPath: /var/lib/qonvexa/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      # Render sets this by default, but two things that must never be left to a platform
      # default depend on it: the Secure flag on the owner's admin session cookie, and the
      # startup check that refuses to boot without ADMIN_PASSWORD, ADMIN_SESSION_SECRET and
      # IP_HASH_SALT (server.js returns early from all of it when NODE_ENV is not production).
      - key: NODE_ENV
        value: production
      - key: LAUNCH_MODE
        value: live
      - key: STORAGE_DIR
        value: /var/lib/qonvexa/data
      - key: AUDIT_PRICE_CENTS
        value: "14900"
      - key: PAYMENT_MODE
        value: manual
      - key: ALLOW_STAGING_PAYMENTS
        value: "false"
      - key: MANUAL_PAYMENT_ENABLED
        value: "true"
      - key: CONTACT_EMAIL
        value: hello@qonvexa.co
      - key: SITE_URL
        value: https://qonvexa.co
      - key: LEGAL_BUSINESS_NAME
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_JURISDICTION
        value: Ukraine
      - key: DELIVERY_TIMEFRAME
        value: "1–24 hours after payment confirmation"
      - key: REFUND_POLICY_TEXT
        value: "If we have not started preparing your personalized audit, you may request a full refund within 24 hours of payment by contacting us. Once delivery has started, refunds are considered case by case."
      - key: BANK_BENEFICIARY
        sync: false
      - key: BANK_NAME
        sync: false
      - key: BANK_IBAN
        sync: false
      - key: BANK_SWIFT
        sync: false
      - key: BANK_CURRENCY
        sync: false
      - key: BANK_PAYMENT_NOTE
        sync: false
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Legacy services are deliberately not referenced by Qonvexa.
      - key: AUTONOMOS_ENABLED
        value: "false"
      - key: QONVEXA_PUBLIC_FETCH_ENABLED
        value: "false"
      - key: QONVEXA_PAYMENTS_ENABLED
        value: "false"
      - key: QONVEXA_OUTBOUND_ENABLED
        value: "false"
      - key: IMPLEMENTATION_DRY_RUN
        value: "true"
      - key: OUTREACH_DRY_RUN
        value: "true"
