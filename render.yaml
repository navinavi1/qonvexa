services:
  - type: web
    name: qonvexa
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev && npm run verify
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    domains:
      - qonvexa.co
    envVars:
      - key: NODE_VERSION
        value: ">=22.0.0 <25.0.0"
      - key: LAUNCH_MODE
        value: staging
      - key: STORAGE_DIR
        value: ./data
      - key: AUDIT_PRICE_CENTS
        value: "14900"
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
