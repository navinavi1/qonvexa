name: One-time AutonomOS mega cleanup
on:
  push:
    paths:
      - 'scripts/one-time-mega-cleanup.mjs'
      - 'scripts/cleanup-postfix.mjs'
      - 'scripts/cleanup-repair.mjs'
      - '.github/workflows/one-time-mega-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Apply one-time cleanup
        run: |
          node scripts/one-time-mega-cleanup.mjs
          node scripts/cleanup-postfix.mjs
          node scripts/cleanup-repair.mjs
      - name: Check transformed runtime syntax
        run: |
          set +e
          OUT=$(node --check src/autonomos/runtime.js 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            LINE=$(printf '%s\n' "$OUT" | sed -n 's#.*runtime.js:\([0-9][0-9]*\).*#\1#p' | head -n1)
            if [ -n "$LINE" ]; then
              START=$((LINE>25 ? LINE-25 : 1))
              END=$((LINE+25))
              echo "--- transformed runtime context $START..$END ---"
              nl -ba src/autonomos/runtime.js | sed -n "${START},${END}p"
            fi
            exit "$CODE"
          fi
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install clean dependencies
        run: npm ci --include=dev
      - name: Verify cleaned production tree
        run: npm run verify
      - name: Commit only if verification passed
        run: |
          rm -f scripts/one-time-mega-cleanup.mjs scripts/cleanup-postfix.mjs scripts/cleanup-repair.mjs .github/workflows/one-time-mega-cleanup.yml
          git config user.name 'AutonomOS Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[cleanup-final] remove obsolete markets tools UI and legacy code'
          git push origin HEAD:main
